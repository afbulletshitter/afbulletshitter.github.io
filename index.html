<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>StratForge has moved</title>
  <style>body{margin:0;background:#101215;color:#f5f7fa;font:16px/1.6 system-ui,sans-serif}.notice{padding:14px 24px;background:#542125;color:#fff1f1}main{max-width:680px;margin:64px auto;padding:24px}a{color:#58a6ff}h1{font-size:28px}p{color:#c6cbd2}</style>
</head>
<body>
  <aside class="notice"><strong>Not cleared for CUI or PII.</strong> Do not enter, upload, or store Controlled Unclassified Information or Personally Identifiable Information.</aside>
  <main><h1>StratForge has moved</h1><p><a href="https://afstratforge.github.io/">Open StratForge</a></p><p><a href="./legacy.html">Recover browser-only work from this address</a></p><noscript><p>JavaScript is disabled. Use the link above to continue.</p></noscript></main>
  <script>
    // Consume account confirmation/recovery links on their original origin.
    // Never forward authentication fragments or visitor data to the new origin.
    const params=new URLSearchParams(location.hash.slice(1));
    if(params.has('access_token')||params.has('refresh_token')||params.has('error')||params.get('type')==='recovery'){
      location.replace('./legacy.html'+location.search+location.hash);
    }else{
      location.replace('https://afstratforge.github.io/');
    }
  </script>
</body>
</html>
